# Fixed project name so volumes keep their names if this folder is moved or renamed
name: ebay-lister

services:
  dev:
    build: .
    image: ebay-lister-dev
    container_name: ebay-lister-dev
    stdin_open: true
    tty: true
    volumes:
      # The project folder on your PC, editable from both sides
      - .:/workspace
      # Claude Code login and global settings, kept between container restarts
      - claude-home:/home/node/.claude
    env_file:
      - path: .env
        required: false

volumes:
  claude-home:
